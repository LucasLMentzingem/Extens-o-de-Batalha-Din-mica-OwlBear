<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa de combate · La Arte</title><link rel="icon" href="icone.svg"><link rel="stylesheet" href="estilo.css?v=0.8.6"></head><body>
<header><div><small>AVENTURA DND</small><h1>Mesa de combate</h1></div><span id="modo">Conectando…</span></header>
<main><p id="aviso" role="status"></p><div id="app"></div></main>
<dialog id="confirmar"><form method="dialog"><h2 id="pergunta"></h2><p id="detalhe"></p><footer><button value="nao">Cancelar</button><button class="primario" value="sim">Confirmar</button></footer></form></dialog>
<dialog id="rolarTeste"><form method="dialog"><h2 id="tituloTeste">Rolagem</h2><p id="bonusTeste"></p><div class="campos"><label>d20<select id="modoTeste"><option value="normal">normal</option><option value="vantagem">vantagem</option><option value="desvantagem">desvantagem</option></select></label><label>Dados extras<input id="dadosTeste" placeholder="1d4 + 1d6"></label><label>+ / −<input id="ajusteTeste" type="number" min="-20" max="20" value="0"></label></div><footer><button value="nao">Cancelar</button><button class="primario" value="sim">Rolar</button></footer></form></dialog>
<dialog id="itemMenu"><h2 id="itemMenuTitulo">Item</h2><p id="itemMenuDescricao"></p><small id="itemMenuCusto"></small><footer id="itemMenuAcoes"></footer></dialog>
<dialog id="habilidadeMenu"><h2 id="habilidadeMenuTitulo">Habilidade</h2><p id="habilidadeMenuDescricao"></p><small id="habilidadeMenuEstado"></small><footer id="habilidadeMenuAcoes"></footer></dialog>
<dialog id="gmAdicionarItem"><form method="dialog"><h2>Adicionar item</h2><p>O item herdará peso, preço, propriedades e regras do catálogo central.</p><div class="campos"><label>Item<select id="gmItemRef"></select></label><label>Quantidade<input id="gmItemQuantidade" type="number" min="1" max="9999" value="1"></label></div><footer><button value="nao">Cancelar</button><button class="primario" value="sim">Adicionar</button></footer></form></dialog>
<dialog id="gmAdicionarPo"><form method="dialog"><h2>Adicionar PO</h2><div class="campos"><label>Quantidade de peças de ouro<input id="gmPoQuantidade" type="number" min="1" max="9999999" value="1"></label></div><footer><button value="nao">Cancelar</button><button class="primario" value="sim">Adicionar</button></footer></form></dialog>
<dialog id="solicitarTroca"><form method="dialog"><h2>Trocar itens</h2><p>Escolha outro personagem. A troca só começa depois que ele aceitar a solicitação.</p><label>Personagem<select id="trocaDestino"></select></label><footer><button value="nao">Cancelar</button><button class="primario" value="sim">Solicitar troca</button></footer></form></dialog>
<dialog id="quantidadeTroca"><form method="dialog"><h2 id="quantidadeTrocaTitulo">Oferecer na troca</h2><p id="quantidadeTrocaDetalhe"></p><label>Quantidade<input id="trocaQuantidade" type="number" min="1" max="9999" value="1"></label><footer><button value="nao">Cancelar</button><button class="primario" value="sim">Oferecer</button></footer></form></dialog>
<link rel="stylesheet" href="tabuleiro.css?v=0.8.6"><script type="module" src="ui.mjs?v=0.8.6"></script></body></html>
